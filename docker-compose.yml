services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admission"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed only for convenience/debugging; the stack talks over the internal network.
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./UserApi
    environment:
      # The backend reads this env var for its database connection.
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/admission?sslmode=disable"
      # Hold duration (mandatory rule, default 600).
      HOLD_DURATION_SECONDS: "600"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. This is the URL the user's browser
        # calls, so it points at the backend as published on the host.
        VITE_API_BASE_URL: "http://localhost:8080"
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
